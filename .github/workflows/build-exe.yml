name: Construire CLAIRE-serveur.exe

# L'exécutable Windows autonome (~85 Mo, voir server/README.md et server/scripts/
# build-windows-exe.mjs) dépasse la limite de taille de fichier du chat — ce workflow le
# reconstruit sur un runner GitHub et le publie comme release téléchargeable, pour que l'étude
# puisse le récupérer directement depuis GitHub sans repasser par la conversation.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      # L'extension Chrome n'est pas dans l'exécutable, mais son faux guichet ne tourne qu'ici pour main (relecture 0.280.0).
      - 'extension-chrome/**'
      - 'index.html'
      - 'style.css'
      - 'client/**'
      - 'commun/**'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - 'tsconfig.json'
      - 'scripts/**'
      - 'tests/**'
      - 'manifest.json'
      - 'sw.js'
      - 'icone.svg'
      - 'appel-de-fonds-modele.js'
      - 'questionnaire-satisfaction-pdf.js'
      - '.github/workflows/build-exe.yml'
      # Mémoire de CLAIRE, « Règles et décisions de l'étude » : embarquées dans le .exe.
      - 'CLAUDE.md'
      - 'docs/historique.md'
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer une release et y attacher l'exécutable
  checks: read # lire le contrôle « verifier » du même commit (étape « Déjà vérifié ? »)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Assez d'historique pour comparer au commit d'avant l'envoi (scripts/fumee-extension-si-besoin.js : le faux guichet de
          # l'extension ne tourne que si elle a changé).
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      # Étude 22/10 (« les relectures et vérifications sont de plus en plus longues ») : le contrôle « verifier » de GitHub est exigé
      # pour pousser sur main et a déjà passé lint, types, les deux suites et la fumée sur CE commit exact (verifier.yml, branche de
      # travail). Le refaire ici retardait l'.exe. Un envoi qui ne l'a pas (modification à la main, relance manuelle) ou dont la
      # lecture échoue refait tout, comme avant.
      - name: Déjà vérifié sur ce commit ?
        id: verifie
        env:
          JETON: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "Lancement manuel : tous les contrôles."; exit 0; fi
          ETAT=$(curl -fsS -H "Authorization: Bearer $JETON" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=verifier&filter=latest" \
            | jq -r '[.check_runs[] | select(.app.slug == "github-actions")] | map(.conclusion) | if length > 0 and all(. == "success") then "ok" else "non" end' 2>/dev/null || true)
          echo "Contrôle « verifier » sur ce commit : ${ETAT:-illisible}"
          if [ "$ETAT" = "ok" ]; then echo "deja=true" >> "$GITHUB_OUTPUT"; echo "Contrôles déjà passés sur ce commit : ils ne sont pas refaits."; fi

      - name: Installer osslsigncode (retrait propre de la signature Authenticode)
        run: sudo apt-get update && sudo apt-get install -y osslsigncode

      - name: Installer l'outillage racine (linter)
        run: npm ci

      - name: Installer les dépendances serveur
        working-directory: server
        run: npm ci

      # Les règles de code (eslint.config.js) : une variable inconnue ou une fonction en double arrête la construction.
      - name: Règles de code
        if: steps.verifie.outputs.deja != 'true'
        run: npm run lint

      # Typage progressif (tsconfig.json) : les fichiers marqués `// @ts-check` (commun/, scripts/, modules purs du serveur)
      # sont vérifiés par TypeScript sans compilation — propriété inexistante, mauvais nombre d'arguments.
      - name: Vérification des types
        if: steps.verifie.outputs.deja != 'true'
        run: npm run types

      # Un exécutable n'est publié que si les deux suites de tests passent : sinon la mise à jour
      # en un clic pourrait installer au bureau une version qui casse une fonction déjà en place.
      - name: Tests côté client
        if: steps.verifie.outputs.deja != 'true'
        run: npm test

      - name: Tests côté serveur
        if: steps.verifie.outputs.deja != 'true'
        working-directory: server
        run: npm test

      # Test de fumée : la page dans un vrai Chromium, servie par le vrai serveur avec des dossiers inventés — tableau de
      # bord, chaque écran, une fiche de chaque sorte, bureau et téléphone — sans erreur d'exécution (tests/fumee/fumee.mjs).
      # Le lint ne voit ni un ordre de chargement faux ni un `undefined.x` au rendu.
      - name: Installer Chromium (test de fumée)
        if: steps.verifie.outputs.deja != 'true'
        run: npx playwright install --with-deps chromium

      - name: Test de fumée dans Chromium
        if: steps.verifie.outputs.deja != 'true'
        run: npm run fumee

      - name: Construire l'exécutable Windows
        working-directory: server
        env:
          # Embarqués dans l'exécutable (build-info.json) pour la mise à jour en un clic : le numéro
          # doit être celui du tag serveur-exe-N publié plus bas.
          CLAIRE_BUILD: ${{ github.run_number }}
          CLAIRE_COMMIT: ${{ github.sha }}
        run: npm run build:exe

      # Seule `main` publie (étude 14/10) : une release est installée seule au bureau dans les 10 minutes ; une construction
      # lancée à la main depuis une autre branche vérifie le code sans rien publier.
      - name: Publier une release GitHub avec l'exécutable
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "serveur-exe-${{ github.run_number }}" \
            server/build/CLAIRE-serveur.exe \
            --target "${{ github.sha }}" \
            --title "CLAIRE-serveur.exe (build ${{ github.run_number }})" \
            --notes "Exécutable Windows autonome du serveur intranet CLAIRE, généré automatiquement depuis le commit ${{ github.sha }}. Voir server/README.md pour l'installation et l'avertissement SmartScreen (exécutable non signé)."
