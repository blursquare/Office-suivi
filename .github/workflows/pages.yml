name: Aperçu GitHub Pages (branche serveur intranet)

# Publie uniquement les fichiers statiques du client (index.html/style.css/script.js...) sur
# GitHub Pages, à titre d'aperçu visuel. Important : cette branche (claude/serveur-intranet)
# suppose un vrai serveur Express/SQLite pour fonctionner (voir server/, CLAUDE.md) — sur
# GitHub Pages, sans ce serveur, seul l'écran de connexion s'affichera et aucune connexion ne
# pourra jamais aboutir (aucun backend pour répondre à /api/login). Voir server/README.md pour
# lancer un vrai serveur fonctionnel.

on:
  push:
    branches: [claude/serveur-intranet]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les fichiers statiques du client
        run: |
          mkdir -p _site
          cp index.html style.css script.js manifest.json sw.js icone.svg _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - id: deployment
        uses: actions/deploy-pages@v4
