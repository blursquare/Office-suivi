<!doctype html><html><head><meta charset="utf-8"><title>Guichet (copie d'essai)</title>
<!-- Copie d'essai du guichet d'Agglopolys pour tests/fumee/extension-gnau.mjs : structure vue dans la vidéo de l'étude (17/10), données inventées. -->
<style>.modal,.fenetre{position:fixed;top:40px;left:40px;background:#fff;border:1px solid #888;padding:10px;z-index:10;width:600px}.rond{display:inline-block;width:40px;height:40px;border-radius:50%;background:#035;color:#fff;text-align:center;line-height:40px;cursor:pointer;margin:4px}
input[readonly]{background:#eef}</style></head><body>
<div id="app"><div class="modal" id="spin">Traitements en cours</div></div>
<script>
const app = document.getElementById('app');
const accueil = () => `
 <div class="bloc"><div class="ruban"><span class="t">S'INFORMER</span><span>sur le règlement</span></div><div class="rond">Zonage</div></div>
 <div class="bloc"><div class="ruban"><span class="t"><b>FORMULER</b></span><span> une demande d'urbanisme numérique...</span></div>
   <div><div class="rond" ng-click="vm.formuler('CUa')" onclick="ouvrirCommune()">CUa</div><div class="rond" ng-click="vm.formuler('CUb')">CUb</div><div class="rond" ng-click="vm.formuler('DIA')" onclick="ouvrirCommune()">DIA</div></div></div>
 ${(window.__cfg || {}).filtreCommune ? '<div class="filtre">Filtrer par commune de dépôt <select onchange="window.__filtre = this.options[this.selectedIndex].text"><option></option><option>Blois</option><option>Vineuil</option></select></div>' : ''}${(window.__cfg || {}).suiviSection ? '<section><h2>SUIVRE</h2><div class="carte"><span ng-click="vm.ouvrir(2)" onclick="window.__carteSuivi = true">CUa</span></div></section>' : ''}
 <div class="bloc"><div class="ruban"><span class="t">${(window.__cfg || {}).titreSuivi || 'SUIVRE'}</span><span>${(window.__cfg || {}).titreSuivi ? '' : "mes demandes d'urbanisme"}</span></div>
   <div class="carte"><span ng-click="vm.ouvrir(1)" onclick="window.__carteSuivi = true">CUA</span> BLOIS <button>Consulter</button></div></div>`;
const cfg = () => window.__cfg || {};
setTimeout(() => { app.innerHTML = accueil(); if (cfg().boutonsTard) { const z = app.querySelectorAll('.bloc')[1].lastElementChild; const h = z.innerHTML; z.innerHTML = ''; setTimeout(() => { z.innerHTML = h; }, 3500); } }, cfg().chargement || 2500);
window.ouvrirCommune = () => { if (cfg().doubleCommune && !window.__double) { window.__double = true; setTimeout(window.ouvrirCommune, 50); } window.__ouvertures = (window.__ouvertures || 0) + 1; setTimeout(() => app.insertAdjacentHTML('beforeend', `<div class="modal fade in" id="mc"><div class="modal-dialog"><div class="modal-content"><div role="dialog"><form name="formSelectionCommune" onsubmit="event.preventDefault();saisie(this)"><div class="modal-header"><p class="popup__titre" id="titre">Sélectionner une commune de dépôt de la demande</p></div><div class="modal-body"><select class="form-control" aria-label="Sélectionner une commune" ng-model="vm.choixVilleInsee" required><option value=""></option>${cfg().optionsLentes ? '' : '<option value="0">Averdon</option><option value="1">Blois</option><option value="2">Candé-sur-Beuvron</option><option value="3">Vineuil</option>'}</select></div><div class="modal-footer"><button class="btn btn-success" type="submit">Valider la commune de dépôt</button><button class="btn btn-default" type="button" ng-click="vm.annuler()" onclick="this.closest('.modal').remove()">Annuler</button></div></form></div></div></div></div>`), cfg().communeLente || 0); if (cfg().optionsLentes) setTimeout(() => { const sc = document.querySelector('#mc select'); ['Averdon','Blois','Candé-sur-Beuvron','Vineuil'].forEach((t, i) => sc.add(new Option(t, String(i)))); }, (cfg().communeLente || 0) + 2500); };
window.saisie = (f) => { const sc = (f && f.querySelector('select')) || document.querySelector('#mc select'); window.__demandes = (window.__demandes || 0) + 1; window.__commune = sc && sc.selectedIndex > 0 ? sc.options[sc.selectedIndex].text : ''; if (!window.__commune) return; location.hash = '#/saisie/19333'; const ev = cfg().ouvertureMousedown ? 'onmousedown' : 'onclick'; app.innerHTML = `${cfg().aideTitre ? '<p><span>Assistant de saisie des références cadastrales : un clic sur une parcelle</span></p><p><span>Assistant de saisie d\'adresse : un clic sur l\'adresse</span></p><button onclick="window.__valPage = true">Valider</button><button onclick="window.__annPage = true">Annuler</button>' : ''}<h3>1 Demandeur</h3> Nom <input id="D1N_nom"> Prénom <input id="D1P_prenom">
 <h3>4.1 Adresse du (ou des) terrain(s)</h3>
 Numéro <input id="T2Q_numero" readonly ${ev}="assAdr()"> Voie <input id="T2V_voie" readonly ${ev}="assAdr()"> Lieu-dit <input id="T2W_lieudit" readonly ${ev}="assAdr()"> Localité <input id="T2L_localite" readonly ${ev}="assAdr()"> CP <input id="T2C_code" readonly ${ev}="assAdr()">
 <h3>4.2 Références cadastrales</h3>
 ${[1,2,3].map(i=>{ const p = i === 1 ? '' : 'P' + i; return `Préfixe <input id="T2F${p}_prefixe" readonly ${ev}="assCad()"> Section <input id="T2S${p}_section" readonly ${ev}="assCad()"> Numéro <input id="T2N${p}_numero" readonly ${ev}="assCad()"> Sup <input id="T2T${p}_superficie" readonly ${ev}="assCad()"><br>`; }).join('')}
 Total <input id="D5T_total" readonly> Fait à <input id="E1L_lieu"> Le <input id="E1D_date"> Signataire <input id="E1S_signataire">
 <div class="pieces"><div class="piece"><div>CU1. Un plan de situation</div><div><label class="btn">Ajouter <input type="file" id="file_input_P2UU1" onchange="window.__piece = this.files[0] && this.files[0].name"></label></div></div></div>
 <button id="id__btnVerifierSaisie" ng-click="vm.verifierSaisie()" onclick="window.__verifie = true">VÉRIFIER MA SAISIE</button>
 <button id="id__btnTransmettreSaisie" ng-click="vm.transmettreSaisie()">Transmettre ma demande</button>`; };
window.assAdr = () => { if (cfg().assistantMort || document.getElementById('ma')) return; app.insertAdjacentHTML('beforeend', `<div class="fenetre" id="ma"><div class="entete"><span>Assistant de saisie d'adresse</span></div>
 <label for="saisieAdresseAuto">Rechercher une adresse</label><input id="saisieAdresseAuto" autocomplete="off"><ul id="sug" class="dropdown-menu"></ul>
 <label for="complement">Lieu-dit</label><input id="complement"><button onclick="validAdr()">Je valide mon adresse</button><button onclick="this.closest('.fenetre').remove()">Fermer</button></div>`);
 const r = document.getElementById('saisieAdresseAuto'); r.addEventListener('input', () => { const v = r.value.toLowerCase(); let s = document.getElementById('sug'); if (cfg().propositionsDiv) { s.style.display = 'none'; s = document.getElementById('sugdiv') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'sugdiv', className: 'typeahead-popup' })); }
   s.innerHTML = v.length < 5 ? '' : (cfg().adresses || ['51 Rue Racine 41000 Blois','51 Rue du Foix 41000 Blois','51 Rue Gallieni 41000 Blois']).filter(x => x.toLowerCase().includes(v.split(' ').slice(0,2).join(' ')) || v.includes('racine') && x.includes('Racine')).map(x => (cfg().propositionsDiv ? `<div class="ligne" onmousedown="choix('${x}')"><span>${x}</span></div>` : `<li><a href="#" onclick="event.preventDefault();choix('${x}')">${x}</a></li>`)).join(''); }); };
let adr = null;
window.choix = (x) => { adr = x; document.getElementById('saisieAdresseAuto').value = x; document.getElementById('sug').innerHTML = ''; const d = document.getElementById('sugdiv'); if (d) d.innerHTML = ''; };
window.validAdr = () => { if (!adr) return; const m = /^(\d+) (.*) (\d{5}) (.*)$/.exec(adr); T2Q_numero.value = m[1]; T2V_voie.value = m[2].toUpperCase(); T2L_localite.value = m[4]; T2C_code.value = m[3]; T2W_lieudit.value = document.getElementById('complement').value; document.getElementById('ma').remove(); };
let parc = null;
window.assCad = () => { if (cfg().assistantMort || document.getElementById('mcad')) return; if (!parc) { parc = (cfg().parcellesInit || []).slice(); window.__parcelles = parc; } app.insertAdjacentHTML('beforeend', `<div class="fenetre" id="mcad"><div class="entete"><span>Assistant de saisie des références cadastrales</span></div>
 <label for="cp">Préfixe</label><input id="cp"><label for="cs">Section *</label><input id="cs"><label for="cn">Numéro *</label><input id="cn" type="number"><label for="cu">Superficie *</label><input id="cu" type="number">
 <button onclick="ajout()">Ajouter la parcelle +</button><table><tbody id="tb"></tbody></table><button onclick="validCad()">Valider</button><button onclick="this.closest('.fenetre').remove()">Fermer</button></div>`); dessine(); };
const dessine = () => { tb.innerHTML = parc.map(p => `<tr><td>${p.pre}</td><td>${p.s}</td><td>${p.n}</td><td>${p.u} m²</td></tr>`).join(''); };
window.ajout = () => { if (!cs.value || !cn.value || !cu.value) return; window.__parcelles = parc; parc.push({ pre: cp.value, s: cs.value.toUpperCase(), n: cn.value, u: cu.value }); cp.value = cs.value = cn.value = cu.value = ''; dessine(); };
window.validCad = () => { parc.slice(0,3).forEach((p,i) => { const q = i ? 'P' + (i+1) : ''; document.getElementById('T2S'+q+'_section').value = p.s; document.getElementById('T2N'+q+'_numero').value = p.n; document.getElementById('T2T'+q+'_superficie').value = p.u; }); D5T_total.value = parc.reduce((a,p)=>a+Number(p.u),0); mcad.remove(); };
</script></body></html>
