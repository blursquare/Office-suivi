<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes & idées — outil de dev</title>
<style>
  :root {
    --bg: #f4f5f0;
    --card: #ffffff;
    --ink: #1c1e1a;
    --muted: #6b6f66;
    --line: #e1e3da;
    --focus: #2563EB;
    --focus-hover: #1D4ED8;
    --success: #1f8a4c;
    --urgent: #d1453b;
    --pret: #c9862b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Inter, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  .sous-titre {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
  }
  .form-ajout {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .form-ajout input[type="text"] {
    flex: 1 1 260px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    background: var(--bg);
    color: var(--ink);
  }
  .form-ajout input[type="text"]:focus {
    outline: none;
    border-color: var(--focus);
  }
  .toggle-plus-tard {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    user-select: none;
    cursor: pointer;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
  }
  button.primary {
    background: var(--focus);
    color: #fff;
  }
  button.primary:hover { background: var(--focus-hover); }
  button.icone-btn {
    background: transparent;
    padding: 4px 8px;
    font-size: 13px;
    color: var(--muted);
  }
  button.icone-btn:hover { color: var(--ink); }

  .colonnes {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 900px) {
    .colonnes { grid-template-columns: 1fr; }
  }
  .colonne {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    min-height: 120px;
  }
  .colonne h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pastille {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .pastille.maintenant { background: var(--urgent); }
  .pastille.plustard { background: var(--pret); }
  .pastille.fait { background: var(--success); }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .item:last-child { border-bottom: none; }
  .item input[type="checkbox"] {
    margin-top: 3px;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .item .texte {
    flex: 1;
    word-break: break-word;
  }
  .item.fait .texte {
    text-decoration: line-through;
    color: var(--muted);
  }
  .item .actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }
  .item .date {
    font-size: 11px;
    color: var(--muted);
    display: block;
    margin-top: 2px;
  }
  .vide {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Notes & idées</h1>
  <p class="sous-titre">Carnet de bord personnel pendant le développement de CLAIRE — pas lié à l'application, stocké uniquement dans ce navigateur (localStorage).</p>

  <div class="form-ajout">
    <input type="text" id="champ-idee" placeholder="Nouvelle idée ou tâche..." onkeydown="if(event.key==='Enter'){ajouterIdee();}">
    <label class="toggle-plus-tard">
      <input type="checkbox" id="case-plus-tard">
      Plus tard
    </label>
    <button class="primary" onclick="ajouterIdee()">+ Ajouter</button>
  </div>

  <div class="colonnes">
    <div class="colonne">
      <h2><span class="pastille maintenant"></span>À faire maintenant</h2>
      <div id="liste-maintenant"></div>
    </div>
    <div class="colonne">
      <h2><span class="pastille plustard"></span>Plus tard</h2>
      <div id="liste-plustard"></div>
    </div>
    <div class="colonne">
      <h2><span class="pastille fait"></span>Fait</h2>
      <div id="liste-fait"></div>
    </div>
  </div>
</div>

<script>
const CLE_STOCKAGE = 'notes_idees_dev_v1';

function charger() {
  try {
    const brut = localStorage.getItem(CLE_STOCKAGE);
    return brut ? JSON.parse(brut) : [];
  } catch (e) {
    return [];
  }
}

function sauvegarder(items) {
  localStorage.setItem(CLE_STOCKAGE, JSON.stringify(items));
}

function formaterDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
    ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function ajouterIdee() {
  const champ = document.getElementById('champ-idee');
  const texte = champ.value.trim();
  if (!texte) return;
  const plusTard = document.getElementById('case-plus-tard').checked;
  const items = charger();
  items.unshift({
    id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
    texte,
    fait: false,
    plusTard,
    creeLe: new Date().toISOString()
  });
  sauvegarder(items);
  champ.value = '';
  document.getElementById('case-plus-tard').checked = false;
  champ.focus();
  render();
}

function toggleFait(id) {
  const items = charger();
  const it = items.find(i => i.id === id);
  if (it) it.fait = !it.fait;
  sauvegarder(items);
  render();
}

function togglePlusTard(id) {
  const items = charger();
  const it = items.find(i => i.id === id);
  if (it) it.plusTard = !it.plusTard;
  sauvegarder(items);
  render();
}

function supprimerItem(id) {
  let items = charger();
  items = items.filter(i => i.id !== id);
  sauvegarder(items);
  render();
}

function creerLigne(it) {
  const div = document.createElement('div');
  div.className = 'item' + (it.fait ? ' fait' : '');

  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.checked = it.fait;
  checkbox.onchange = () => toggleFait(it.id);

  const texteWrap = document.createElement('div');
  texteWrap.className = 'texte';
  texteWrap.textContent = it.texte;
  const dateEl = document.createElement('span');
  dateEl.className = 'date';
  dateEl.textContent = formaterDate(it.creeLe);
  texteWrap.appendChild(dateEl);

  const actions = document.createElement('div');
  actions.className = 'actions';

  if (!it.fait) {
    const btnPlusTard = document.createElement('button');
    btnPlusTard.className = 'icone-btn';
    btnPlusTard.title = it.plusTard ? 'Remettre en "maintenant"' : 'Mettre en "plus tard"';
    btnPlusTard.textContent = it.plusTard ? '↩' : '⏲';
    btnPlusTard.onclick = () => togglePlusTard(it.id);
    actions.appendChild(btnPlusTard);
  }

  const btnSupprimer = document.createElement('button');
  btnSupprimer.className = 'icone-btn';
  btnSupprimer.title = 'Supprimer';
  btnSupprimer.textContent = '✕';
  btnSupprimer.onclick = () => supprimerItem(it.id);
  actions.appendChild(btnSupprimer);

  div.appendChild(checkbox);
  div.appendChild(texteWrap);
  div.appendChild(actions);
  return div;
}

function render() {
  const items = charger();
  const maintenant = items.filter(i => !i.fait && !i.plusTard);
  const plustard = items.filter(i => !i.fait && i.plusTard);
  const fait = items.filter(i => i.fait);

  const conteneurs = {
    maintenant: document.getElementById('liste-maintenant'),
    plustard: document.getElementById('liste-plustard'),
    fait: document.getElementById('liste-fait')
  };

  Object.values(conteneurs).forEach(c => c.innerHTML = '');

  if (maintenant.length === 0) {
    conteneurs.maintenant.innerHTML = '<p class="vide">Rien pour le moment.</p>';
  } else {
    maintenant.forEach(it => conteneurs.maintenant.appendChild(creerLigne(it)));
  }

  if (plustard.length === 0) {
    conteneurs.plustard.innerHTML = '<p class="vide">Rien pour le moment.</p>';
  } else {
    plustard.forEach(it => conteneurs.plustard.appendChild(creerLigne(it)));
  }

  if (fait.length === 0) {
    conteneurs.fait.innerHTML = '<p class="vide">Rien de fait pour l\'instant.</p>';
  } else {
    fait.forEach(it => conteneurs.fait.appendChild(creerLigne(it)));
  }
}

render();
</script>
</body>
</html>
