<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLAIRE — CU a) et DIA automatique</title>
  <link rel="icon" href="../icons/claire-32.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <h1 class="marque">
      <svg width="28" height="28" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="#fff" stroke="#D5D8DD"/>
        <path d="M33 12a15 15 0 1 0 0 24" stroke="#111418" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M27 23.5 L31.5 29 L40 17" stroke="#111418" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Claire</span>
      <small class="sous-titre">CU a) et DIA automatique</small>
    </h1>
    <span id="link" class="link off" title="Serveur CLAIRE du bureau">CLAIRE non réglé</span>
  </header>

  <section class="card" id="connexion">
    <h2>Connexion</h2>
    <input type="text" id="serveur" placeholder="http://192.168.60.10:3000" autocomplete="off" aria-label="Adresse de CLAIRE">
    <button type="button" id="enregistrer" class="secondaire">Enregistrer</button>
    <p id="connexion-msg" class="msg"></p>
  </section>

  <section class="card etape" id="etape-dossier">
    <h2><span class="num">1</span>Dossier</h2>
    <input type="search" id="recherche" placeholder="Nom, commune, référence…" autocomplete="off" aria-label="Chercher un dossier">
    <div id="resultats" class="resultats"></div>
    <p id="choisi" class="choisi"></p>
  </section>

  <section class="card etape" id="etape-demarche">
    <h2><span class="num">2</span>Démarche</h2>
    <div class="choix" id="procedures" role="radiogroup" aria-label="Démarche"></div>
    <select id="procedure" hidden aria-hidden="true"></select>
    <details id="manques" class="manques" hidden><summary></summary><ul></ul></details>
  </section>

  <section class="card etape" id="etape-lancer">
    <h2><span class="num">3</span>Remplir le guichet</h2>
    <button id="auto" class="principal" disabled>Lancer CLAIRE</button>
    <p class="aide">Onglet du guichet ouvert sur l’accueil. CLAIRE s’arrête avant « Transmettre ».</p>
    <p id="setup-msg" class="msg"></p>
    <details class="options">
      <summary>Options</summary>
      <label>Vitesse
        <select id="speed">
          <option value="slow">Lente</option>
          <option value="normal">Normale</option>
          <option value="fast" selected>Rapide</option>
        </select>
      </label>
      <button type="button" id="oublier-brouillons" class="lien">Oublier les brouillons gardés (repartir d’une nouvelle demande)</button>
      <button type="button" id="structure" class="lien">Copier la structure de la page (sans données)</button>
    </details>
  </section>

  <section class="card" id="run" hidden>
    <div id="status" class="status"></div>
    <div class="bar"><div id="bar-fill"></div></div>
    <p id="compte" class="compte"></p>
    <ol id="etapes" class="etapes" aria-label="Avancement du remplissage"></ol>
    <div class="controls">
      <button id="pause" class="secondaire">Pause</button>
      <button id="resume" class="secondaire" hidden>Reprendre</button>
      <button id="stop" class="danger">Arrêter</button>
      <button id="reset" class="secondaire" hidden>Effacer</button>
    </div>
  </section>

  <details id="detail" class="detail" hidden>
    <summary>Détail des champs</summary>
    <section id="list"></section>
  </details>

  <script src="../lib/fiche.js"></script>
  <script src="panel.js"></script>
</body>
</html>
